# Development environment configuration
# Standard Spring Boot configuration pattern

server:
  port: 8081

spring:
  application:
    name: "Auth-Dev"
  devtools:
    add-properties: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# Development database - hardcoded values (safe for development)
adapters:
  r2dbc:
    host: localhost
    port: 5433
    database: mydatabase
    schema: public
    username: myuser
    password: secret

# Disable AWS secrets for development
aws:
  enabled: false

logging:
  level:
    root: WARN
    com.crediya: DEBUG
    io.r2dbc.postgresql: ERROR
    org.springframework.data.r2dbc: ERROR
    co.com.bancolombia.secretsmanager: ERROR
    org.springframework: WARN
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level){highlight} %clr([%15.15t]){faint} %clr([%X{correlationId:-NO_TRACE}]){magenta} %clr(%logger{36}){blue} - %msg%n%wEx{2}"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    filter: true
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080,http://localhost:8081"

# JWT Security Configuration
security:
  jwt:
    secret: "mySecretKeyForDevelopment123456789012345678901234567890SecureHS512"
    access-token-validity-minutes: 15
    refresh-token-validity-days: 7