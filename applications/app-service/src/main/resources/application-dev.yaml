# Development environment configuration
# Standard Spring Boot configuration pattern

server:
  port: 8081

spring:
  application:
    name: "Auth-Dev"
  devtools:
    add-properties: false

# Development database - hardcoded values (safe for development)
adapters:
  r2dbc:
    host: localhost
    port: 5433
    database: mydatabase
    schema: public
    username: myuser
    password: secret

# Disable AWS secrets for development
aws:
  enabled: false

logging:
  level:
    io.r2dbc.postgresql: DEBUG
    org.springframework.data.r2dbc: DEBUG
    co.com.bancolombia.secretsmanager: DEBUG

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    filter: true
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080,http://localhost:8081"