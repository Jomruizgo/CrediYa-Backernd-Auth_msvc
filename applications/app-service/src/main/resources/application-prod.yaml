# Production environment configuration

server:
  port: 8081

spring:
  application:
    name: "Auth-Prod"
  devtools:
    add-properties: false

# Database configuration using environment variables
adapters:
  r2dbc:
    host: ${DB_HOST}
    port: ${DB_PORT:5432}
    database: ${DB_NAME}
    schema: ${DB_SCHEMA:public}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# Production logging - less verbose
logging:
  level:
    io.r2dbc.postgresql: INFO
    org.springframework.data.r2dbc: INFO
    root: INFO

# Disable Swagger in production for security
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  security:
    enabled: true

# Production CORS - restrictive
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.crediya.com,https://admin.crediya.com}

# Security headers
security:
  headers:
    frame-options: DENY
    content-type-options: true
    xss-protection: true