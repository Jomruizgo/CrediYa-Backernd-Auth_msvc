# Production environment configuration

server:
  port: 8081

spring:
  application:
    name: "Auth-Prod"
  devtools:
    add-properties: false

# Database configuration using environment variables
# These MUST be set as environment variables in production
adapters:
  r2dbc:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:production_db}
    schema: ${DB_SCHEMA:public}
    username: ${DB_USERNAME:prod_user}
    password: ${DB_PASSWORD:CHANGE_ME}

# Production logging - less verbose
logging:
  level:
    io.r2dbc.postgresql: INFO
    org.springframework.data.r2dbc: INFO
    root: INFO

# Disable Swagger in production for security
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  security:
    enabled: true

# Production CORS - restrictive
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.crediya.com,https://admin.crediya.com}

# Security headers
security:
  headers:
    frame-options: DENY
    content-type-options: true
    xss-protection: true
  # JWT Configuration - use environment variables in production
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_SECRET_IN_PRODUCTION_123456789012345678901234567890}
    access-token-validity-minutes: ${JWT_ACCESS_TOKEN_VALIDITY:15}
    refresh-token-validity-days: ${JWT_REFRESH_TOKEN_VALIDITY:7}