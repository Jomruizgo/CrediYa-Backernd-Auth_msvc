name=PropertiesConfig
property.filename=logs
appenders=console, file
appender.console.type=Console
appender.console.name=STDOUT
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %X{correlationId:-NO_CORRELATION_ID} %c{1} - %msg%n
appender.file.type=File
appender.file.name=FILEOUT
appender.file.fileName=${filename}.log
appender.file.layout.type=PatternLayout
appender.file.layout.pattern=[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %X{correlationId:-NO_CORRELATION_ID} %c{1} - %msg%n
rootLogger.level=info
rootLogger.appenderRefs=stdout, fileout
rootLogger.appenderRef.stdout.ref=STDOUT
rootLogger.appenderRef.fileout.ref=FILEOUT